[package]
name = "mmc-batch-backend"
version = "0.2.0"
edition = "2021"

# Bibliotheque de conversion, utilisee directement par l'appli Tauri
[lib]
name = "mmc_batch_core"
path = "src/lib.rs"

# Serveur HTTP optionnel (interface dans un navigateur) : `cargo run`
[[bin]]
name = "mmc-batch-backend"
path = "src/main.rs"
required-features = ["serveur"]

[features]
default = ["serveur"]
serveur = ["dep:anyhow", "dep:axum", "dep:serde_json", "dep:tokio", "dep:tower-http"]

[dependencies]
calamine = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"

anyhow = { version = "1", optional = true }
axum = { version = "0.7", features = ["multipart"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
serde_json = "1"
