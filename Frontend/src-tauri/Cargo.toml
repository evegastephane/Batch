[package]
name = "mmc-batch"
version = "0.1.0"
edition = "2021"

[lib]
name = "mmc_batch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mmc-batch"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
