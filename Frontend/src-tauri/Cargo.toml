[package]
name = "mmc-batch"
version = "0.1.0"
edition = "2021"

[lib]
name = "mmc_batch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mmc-batch"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Conversion Excel -> CSV/TXT, partagee avec le serveur HTTP de BackendRust
mmc-batch-backend = { path = "../../BackendRust", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
